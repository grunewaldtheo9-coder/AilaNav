<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aila Nav - O seu Navegador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 50px; }
        .logo { font-size: 48px; font-weight: bold; color: #4285f4; margin-bottom: 20px; }
        .search-box { background: white; padding: 10px 20px; border-radius: 30px; width: 500px; display: inline-flex; align-items: center; }
        input { border: none; width: 100%; outline: none; font-size: 16px; }
        button { background: #4285f4; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; margin-left: 10px; }
        #resultado { margin-top: 30px; border: 2px solid #444; border-radius: 10px; display: none; width: 80%; height: 600px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>

    <div class="logo">Aila Nav</div>

    <div class="search-box">
        <input type="text" id="urlInput" placeholder="Digite a URL (ex: https://google.com)">
        <button onclick="navegar()">Ir</button>
    </div>

    <p id="status"></p>
    
    <!-- Aqui aparecerá o site selecionado -->
    <iframe id="resultado" src="" title="Visão do Navegador"></iframe>

    <script>
        function navegar() {
            let url = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            const iframe = document.getElementById('resultado');

            if (!url) {
                alert('Digite um site!');
                return;
            }

            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            status.innerText = 'O motor Aila Nav está carregando o site...';
            iframe.src = url;
            iframe.style.display = 'block';
            status.innerText = 'Site carregado! Se o site não aparecer, pode estar bloqueado por políticas de segurança de iframe.';
        }
    </script>
</body>
</html>
